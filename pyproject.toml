[project]
name = "museum-guide"
version = "0.1.0"
description = "Neural-network components of a museum guide: artwork classification on WikiArt"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "pillow",
    "datasets>=3.0",
    "transformers",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
