name: pinned versions

# The same tests with the known-good versions of constraints/py311.txt. It catches a dependency release that
# breaks the project (the main workflow installs the latest versions) and a constraints file that no longer resolves.
# A separate workflow file keeps it independent of tests.yml.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "constraints/**"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - ".github/workflows/pinned.yml"
  workflow_dispatch:

jobs:
  pytest-pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints/py311.txt
      # CPU-only wheels, kept in the tested minor version by the constraints file.
      - name: Install PyTorch (CPU)
        run: pip install -c constraints/py311.txt torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install the package and test dependencies with the pinned versions
        run: pip install -c constraints/py311.txt -e ".[dev]"
      - name: Run the tests
        run: pytest -q
