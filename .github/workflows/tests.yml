name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Linting needs no PyTorch. Same version range as the `dev` extra: a new ruff minor can promote rules.
      - name: Install ruff
        run: pip install "ruff>=0.17,<0.18"
      - name: Lint
        run: ruff check .

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # CPU-only wheels: the default Linux wheel pulls ~2 GB of CUDA libraries the tests never use.
      - name: Install PyTorch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install the package and test dependencies
        run: pip install -e ".[dev]"
      # The floor sits a few points below the measured coverage of src/museum_guide, so a PR that adds untested
      # code fails here, while normal refactoring does not. Nothing is uploaded anywhere.
      - name: Run the tests with coverage
        run: pytest -q --cov=museum_guide --cov-report=term-missing --cov-fail-under=95
      # Needs the dependencies installed (otherwise every import is untyped and nothing is checked), so it lives
      # in this job rather than in the lint job.
      - name: Check the types
        run: mypy
