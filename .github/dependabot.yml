# Weekly dependency updates. Dependabot only opens pull requests: nothing is merged without a review,
# and the CI (lint and tests) runs on each of them.
version: 2
updates:
  # Python dependencies declared in pyproject.toml. Several are lower bounds (torch>=2.2...), so Dependabot
  # mostly bumps the pinned ranges (ruff, gradio) and the extras.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  # Versions of the actions used by .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
